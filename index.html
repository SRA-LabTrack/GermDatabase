<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e633b" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fra.cloud.appwrite.io" crossorigin />
    <link rel="dns-prefetch" href="//fra.cloud.appwrite.io" />
    <meta name="description" content="Agriculture-focused sugarcane germination and varietal characterization registry with lean indexed search, cursor pagination, local drafts, Excel import, and storage-efficient WebP field photos." />
    <title>CaneSprout Registry | Sugarcane</title>
    <style>
      html,body,#root{margin:0;min-height:100%;background:#f6faef;color:#173e27}
      body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .html-boot,.app-boot-screen{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 20% 15%,rgba(182,220,145,.35),transparent 35%),radial-gradient(circle at 80% 20%,rgba(250,225,89,.28),transparent 34%),linear-gradient(135deg,#f9fcf4,#f6f7dc)}
      .html-boot-card,.app-boot-card{width:min(430px,calc(100vw - 48px));padding:24px 26px;border:1px solid rgba(255,255,255,.82);border-radius:28px;background:rgba(255,255,255,.74);box-shadow:0 24px 70px rgba(39,91,55,.12);display:grid;grid-template-columns:54px 1fr;gap:14px;align-items:center}
      .html-boot-mark,.app-boot-mark{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:linear-gradient(145deg,#e9dc55,#9bd478);color:#17492d}
      .html-boot-card strong,.app-boot-card strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1.05}.html-boot-card span,.app-boot-card span{display:block;margin-top:5px;font-size:13px;color:#6d8173}
      .html-boot-progress,.app-boot-progress{grid-column:1/-1;height:4px;border-radius:99px;overflow:hidden;background:#e7eddc;position:relative}.html-boot-progress:after,.app-boot-progress:after{content:"";position:absolute;inset:0;width:38%;border-radius:inherit;background:linear-gradient(90deg,#2a7545,#a4c944,#e0c742);animation:boot 1.15s ease-in-out infinite alternate}
      @keyframes boot{from{transform:translateX(-8%)}to{transform:translateX(172%)}}
      @media(prefers-reduced-motion:reduce){.html-boot-progress:after,.app-boot-progress:after{animation:none;width:75%}}
    </style>
  </head>
  <body>
    <div id="root">
      <main class="html-boot" aria-label="Loading CaneSprout Registry">
        <section class="html-boot-card">
          <span class="html-boot-mark" aria-hidden="true">🌱</span>
          <div><strong>CaneSprout Registry</strong><span>Opening the sugarcane field registry…</span></div>
          <i class="html-boot-progress" aria-hidden="true"></i>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
